<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>손끝 소리 안내 · 시연</title><style>*{box-sizing:border-box}body{margin:0;background:#101b19;color:#ecf5ef;font:17px system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:0;font-size:28px}h2{font-size:20px;margin:0 0 16px}p{line-height:1.6}small,.muted{color:#b4c9be}.layout{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(285px,1fr);gap:20px;margin-top:20px}.panel{background:#1b2b25;border:1px solid #365043;border-radius:18px;padding:20px}label{display:block;margin-bottom:14px}input,select,button{font:inherit;border:1px solid #547262;border-radius:12px;min-height:54px;padding:12px;width:100%}input,select{background:#101b19;color:white;margin-top:8px}button{background:#c3f394;color:#142013;cursor:pointer;font-weight:650}button:disabled{opacity:.45}button.secondary{background:#293d34;color:#ecf5ef}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.wide{grid-column:1/-1}#view{position:relative;background:#050a08;border-radius:12px;overflow:hidden;min-height:220px}video{display:block;width:100%;height:auto}#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#direction{font-size:clamp(28px,4vw,48px);font-weight:750;color:#c3f394;margin:12px 0}#status,#ocrState,#lockState,#soundStatus{font-size:15px}#soundStatus{color:#c3f394}#distance{font-size:14px;color:#b4c9be}#soundDetails{display:none}input[type=range]{padding:0;min-height:32px}footer{color:#b4c9be;font-size:14px;margin-top:16px}@media(max-width:850px){.layout{grid-template-columns:1fr}main{padding:16px}header{align-items:flex-start}h1{font-size:24px}}</style></head><body><main><header><div><small>CAMERA × AUDIO</small><h1>손끝 소리 안내</h1></div><small>시연 모드 · v5</small></header><div class="layout"><section class="panel"><div id="view"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas></div><div id="direction" role="status">안내 대기</div><p id="detection">목표 글자와 검지를 인식해 안내합니다.</p><p id="distance">위치 차이: —</p></section><aside><section class="panel"><h2>목표 설정</h2><label for="target">찾을 글자<input id="target" value="START" maxlength="40" autocomplete="off"></label><label for="language">인식 언어<select id="language"><option value="eng">영어</option><option value="kor+eng">한국어 + 영어</option></select></label><div class="actions"><button id="start">시연 시작</button><button id="stop" class="secondary">정지</button><button id="refind" class="secondary wide">목표 다시 찾기</button></div><p id="status" role="status">시작을 누르고 카메라 권한을 허용하세요.</p><p id="lockState">목표 좌표: 미고정</p><p id="ocrState">글자 인식 대기</p></section><section class="panel" style="margin-top:16px"><h2>소리 안내</h2><button id="soundToggle" aria-pressed="false">소리 안내 시작</button><label for="soundVolume" style="margin-top:16px">음량 <output id="soundVolumeValue">20%</output><input id="soundVolume" type="range" min="0" max="0.2" step="0.005" value="0.04"></label><p id="soundStatus" role="status">소리 꺼짐</p><p id="soundDetails"></p><p class="muted" style="font-size:14px">좌우는 들리는 귀 · 위아래는 음높이<br>목표에 가까워질수록 빠르게 울립니다.</p></section></aside></div><footer>이어폰을 연결하고 낮은 음량으로 시작하세요. 카메라와 화면을 고정하고, 화면이 바뀌면 ‘목표 다시 찾기’를 누르세요. 도달음은 실제 버튼 선택 성공을 뜻하지 않습니다.</footer></main><script>
const $=id=>document.getElementById(id),v=$('video'),c=$('overlay'),ctx=c.getContext('2d');let stream=null,active=false,run=0,hand=null,worker=null,frame=0,ocrTimer=null,box=null,tip=null,boxTime=0,handTime=0,ocrBusy=false,lastVideo=-1,targetRevision=0,ocrSequence=0,targetLocked=false;
function log(t){console.info('[안내]',t)}
function reset(){window.resetSoundTarget?.();targetLocked=false;$('lockState').textContent='목표 좌표: 미고정';$('ocrState').textContent='인식 대기 / 정지';box=null;tip=null;boxTime=0;handTime=0;$('direction').textContent='안내 대기';$('distance').textContent='위치 차이: —';ctx.clearRect(0,0,c.width,c.height)}
log('protocol: '+location.protocol+' | secureContext: '+isSecureContext+' | mediaDevices: '+!!navigator.mediaDevices+' | iframe: '+(self!==top));
if(navigator.permissions)navigator.permissions.query({name:'camera'}).then(p=>{log('permission: '+p.state);p.onchange=()=>log('permission: '+p.state)}).catch(()=>{});
function stop(){window.stopSoundGuidance?.();run++;active=false;cancelAnimationFrame(frame);clearTimeout(ocrTimer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;if(hand){try{hand.close()}catch(e){}hand=null}if(worker){worker.terminate().catch(()=>{});worker=null}ocrBusy=false;reset();$('status').textContent='정지됨';$('detection').textContent='AI 꺼짐';$('start').disabled=false;}
async function camera(){stop();const id=run;if(!navigator.mediaDevices?.getUserMedia)throw Error('이 환경은 카메라를 지원하지 않습니다. HTTPS 주소를 Chrome에서 직접 여세요.');$('start').disabled=true;$('status').textContent='카메라 권한 요청 중…';let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});if(id!==run){s.getTracks().forEach(t=>t.stop());return null}stream=s;v.srcObject=s;await v.play();if(id!==run)return null;active=true;c.width=v.videoWidth;c.height=v.videoHeight;$('status').textContent='카메라 실행 중';$('start').disabled=false;log('카메라 준비 '+v.videoWidth+'×'+v.videoHeight);return id}catch(e){if(s)s.getTracks().forEach(t=>t.stop());throw e}}
function fail(e){log((e.name||'Error')+': '+e.message);$('status').textContent='오류: '+e.message;$('start').disabled=false}
function loadScript(url){return new Promise((ok,no)=>{let s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=()=>no(Error('라이브러리 다운로드 실패: '+url));document.head.append(s)})}
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\s.,!?·:;()\[\]]/g,'');
function paint(){ctx.clearRect(0,0,c.width,c.height);const now=performance.now();if(tip&&now-handTime>500)tip=null;let b=box,f=tip;if(f){ctx.fillStyle='#ff957b';ctx.beginPath();ctx.arc(f.x,f.y,9,0,Math.PI*2);ctx.fill()}if(b){ctx.strokeStyle='#c3f394';ctx.lineWidth=3;ctx.strokeRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0)}$('detection').textContent='검지: '+(f?'인식':'찾는 중')+' / 목표: '+(b?'인식':'찾는 중');if(!f||!b){$('direction').textContent='인식 대기';$('distance').textContent='위치 차이: —';return}const x=(b.x0+b.x1)/2,y=(b.y0+b.y1)/2,dx=x-f.x,dy=y-f.y,d=Math.hypot(dx,dy);ctx.strokeStyle='#70d8de';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(x,y);ctx.stroke();const near=d<Math.max(18,Math.min(b.x1-b.x0,b.y1-b.y0)*.5);$('direction').textContent=near?'목표 글자 근처':Math.abs(dx)>Math.abs(dy)?dx>0?'→ 오른쪽':'← 왼쪽':dy>0?'↓ 아래쪽':'↑ 위쪽';$('distance').textContent='Δx '+Math.round(dx)+' / Δy '+Math.round(dy)+' / '+Math.round(d)+' px';}
function loop(id){if(id!==run||!active)return;try{if(hand&&v.readyState>=2&&v.currentTime!==lastVideo){lastVideo=v.currentTime;const r=hand.detectForVideo(v,performance.now());const p=r.landmarks?.[0]?.[8];tip=p?{x:p.x*c.width,y:p.y*c.height}:null;handTime=performance.now()}paint()}catch(e){log('손 추적: '+e.message);tip=null;paint()}frame=requestAnimationFrame(()=>loop(id))}
function ocrCandidates(data,target){
const lines=(data.lines||[]).filter(l=>l.bbox),words=(data.words||[]).filter(l=>l.bbox);
let matches=words.filter(l=>norm(l.text)===target);
if(!matches.length)matches=lines.filter(l=>norm(l.text)===target);
if(!matches.length)matches=lines.filter(l=>norm(l.text).includes(target));
return matches;
}
function sceneSample(){const q=document.createElement('canvas');q.width=48;q.height=27;const x=q.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,48,27);return x.getImageData(0,0,48,27).data;}
function sceneDifference(a,b){let sum=0;for(let i=0;i<a.length;i+=4)sum+=(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]))/3;return sum/(a.length/4)/255;}
async function ocr(id){
if(id!==run||!active||!worker||ocrBusy||targetLocked)return;
const w=worker,target=norm($('target').value),revision=targetRevision;
if(!target){box=null;ocrTimer=setTimeout(()=>ocr(id),1000);return;}
ocrBusy=true;const seq=++ocrSequence;const started=performance.now();
$('ocrState').textContent='문자 인식 중 #'+seq;log('OCR #'+seq+' 시작');
try{
const a=document.createElement('canvas');a.width=Math.min(1600,c.width);a.height=Math.round(c.height*a.width/c.width);
a.getContext('2d').drawImage(v,0,0,a.width,a.height);
const before=sceneSample();
const r=await w.recognize(a);
if(id!==run)return;
const elapsed=performance.now()-started;


log('OCR #'+seq+' 완료 '+(elapsed/1000).toFixed(2)+'초 / '+JSON.stringify((r.data.text||'').slice(0,160)));
box=null;
if(revision!==targetRevision||target!==norm($('target').value)){return;}
if(elapsed>15000){return;}
const change=sceneDifference(before,sceneSample());
if(change>0.16){return;}
const candidates=ocrCandidates(r.data,target);$('status').textContent=candidates.length>1?'같은 문구가 여러 개입니다. 하나만 보이게 촬영하세요.':candidates.length===0?'목표 글자를 찾는 중 · 글자를 크게 보여주세요.':'목표 고정 · 검지를 화면에 보여주세요.';
if(candidates.length===1){const b=candidates[0].bbox,kx=c.width/a.width,ky=c.height/a.height;box={x0:b.x0*kx,y0:b.y0*ky,x1:b.x1*kx,y1:b.y1*ky};boxTime=performance.now();targetLocked=true;$('lockState').textContent='목표 좌표: 고정됨 · OCR 중지';log('목표 좌표 고정: OCR을 중지하고 검지만 추적합니다.');}

}catch(e){if(id===run){box=null;log('OCR 오류: '+e.message);$('status').textContent='문자 인식 오류: '+e.message;}}
finally{if(id===run){ocrBusy=false;$('ocrState').textContent=targetLocked?'좌표 고정 · OCR 중지 · 검지 추적 중':'인식 완료 / 다음 분석 대기';paint();if(!targetLocked)ocrTimer=setTimeout(()=>ocr(id),1000);}}
}
async function ai(id){loop(id);$('status').textContent='카메라 준비 · 인식 모델 불러오는 중…';await Promise.allSettled([(async()=>{try{log('손 모델 로딩');const mp=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs');const fs=await mp.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm');const h=await mp.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:1});if(id!==run){h.close();return}hand=h;log('손 모델 준비')}catch(e){if(id===run)log('손 모델 실패: '+e.message);$('detection').textContent='검지 인식 준비 실패: '+e.message}})(),(async()=>{try{log('OCR 로딩');if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');if(id!==run)return;const w=await Tesseract.createWorker($('language').value,1,{logger:m=>{if(id===run&&m.status==='loading language traineddata')$('status').textContent='언어 모델 다운로드 중…'}});if(id!==run){await w.terminate();return}await w.setParameters({tessedit_pageseg_mode:'11',preserve_interword_spaces:'1'});if(id!==run){await w.terminate();return;}worker=w;log('OCR 준비: '+$('language').value);$('ocrState').textContent='OCR 준비 완료';ocr(id)}catch(e){if(id===run){log('OCR 실패: '+e.message);$('ocrState').textContent='OCR 초기화 실패: '+e.message;}}})()]);if(id===run)$('status').textContent=hand&&worker?'AI 실행 중':'일부 인식 기능을 불러오지 못했습니다. 정지 후 다시 시작하세요.';}
$('start').onclick=async()=>{try{const id=await camera();if(id!==null)await ai(id)}catch(e){fail(e)}};$('stop').onclick=stop;function refindTarget(){window.resetSoundTarget?.();targetRevision++;targetLocked=false;box=null;boxTime=0;clearTimeout(ocrTimer);$('lockState').textContent='목표 좌표: 미고정 · 재탐색';paint();if(active&&worker&&!ocrBusy)ocr(run);else if(!active)$('ocrState').textContent='AI 시작 후 목표를 찾습니다.';}
$('target').oninput=refindTarget;$('refind').onclick=refindTarget;$('language').onchange=()=>{stop();$('status').textContent='언어 변경: AI 시작을 다시 누르세요';};addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
window.readSoundGuidance=()=>({active,locked:targetLocked,box,tip,age:performance.now()-handTime,w:c.width,h:c.height,ready:v.readyState,videoTime:v.currentTime,run});
</script><script src="audio.js?v=4"></script></body></html>
